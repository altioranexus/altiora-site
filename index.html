<!DOCTYPE html>
<html lang="it">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Altiora Nexus LTD</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            color: white;
            min-height: 100vh;
            overflow-x: hidden;
            background:
                radial-gradient(circle at 15% 20%, rgba(31, 91, 169, 0.22), transparent 28%),
                radial-gradient(circle at 85% 18%, rgba(0, 140, 255, 0.14), transparent 24%),
                radial-gradient(circle at 70% 80%, rgba(28, 69, 122, 0.18), transparent 26%),
                linear-gradient(135deg, #01050b 0%, #03101c 30%, #071a2c 62%, #0b2238 100%);
        }

        .hamburger {
            position: fixed;
            top: 25px;
            right: 25px;
            z-index: 1001;
            width: 42px;
            height: 32px;
            cursor: pointer;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
        }

        .hamburger span {
            display: block;
            width: 100%;
            height: 4px;
            background: white;
            border-radius: 3px;
            transition: 0.3s;
        }

        .side-menu {
            position: fixed;
            top: 0;
            right: -55%;
            width: 55%;
            min-width: 340px;
            height: 100vh;
            background: rgba(2, 8, 18, 0.96);
            backdrop-filter: blur(8px);
            z-index: 1000;
            transition: right 0.45s ease;
            display: flex;
            flex-direction: column;
            justify-content: center;
            padding: 40px;
            box-shadow: -10px 0 30px rgba(0, 0, 0, 0.45);
        }

        .side-menu a {
            color: white;
            text-decoration: none;
            font-size: 2rem;
            margin: 14px 0;
            padding: 16px 20px;
            border-radius: 14px;
            transition: background 0.25s, transform 0.25s;
            opacity: 0.95;
        }

        .side-menu a:hover {
            background: rgba(255, 255, 255, 0.10);
            transform: translateX(-8px);
        }

        .side-menu.open {
            right: 0;
        }

        .hamburger.open span:nth-child(1) {
            transform: rotate(45deg) translate(9px, 9px);
        }

        .hamburger.open span:nth-child(2) {
            opacity: 0;
        }

        .hamburger.open span:nth-child(3) {
            transform: rotate(-45deg) translate(9px, -9px);
        }

        .content {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 30px;
        }

        .logo-text {
            font-size: 2.2rem;
            letter-spacing: 6px;
            font-weight: 700;
            margin-bottom: 16px;
            color: #dbeafe;
        }

        h1 {
            font-size: 2.6rem;
            margin: 0;
            color: white;
        }

        @media (max-width: 768px) {
            .side-menu {
                width: 82%;
                right: -82%;
                min-width: unset;
            }

            .side-menu a {
                font-size: 1.5rem;
            }

            .logo-text {
                font-size: 1.5rem;
                letter-spacing: 4px;
            }

            h1 {
                font-size: 2rem;
            }
        }
    </style>
</head>
<body>

    <div class="hamburger" id="hamburger" onclick="toggleMenu()">
        <span></span>
        <span></span>
        <span></span>
    </div>

    <nav class="side-menu" id="sideMenu">
        <a href="/site">Home</a>
        <a href="/about">About Us</a>
        <a href="/info">Info</a>
        <a href="/contacts">Contacts</a>
        <a href="/logout">Log Out</a>
    </nav>

    <div class="content">
        <div class="logo-text">ALTIORA NEXUS</div>
        <h1>Benvenuto</h1>
    </div>

    <script>
        function toggleMenu() {
            document.getElementById("sideMenu").classList.toggle("open");
            document.getElementById("hamburger").classList.toggle("open");
        }
    </script>

</body>
</html>
