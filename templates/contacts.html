<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contacts - Altiora Nexus Ltd</title>
    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
            color: white;
            min-height: 100vh;
            background:
                radial-gradient(circle at 10% 20%, rgba(40, 110, 200, 0.18), transparent 30%),
                radial-gradient(circle at 90% 80%, rgba(0, 120, 180, 0.14), transparent 30%),
                linear-gradient(135deg, #01050b 0%, #03101c 30%, #071a2c 65%, #0b2238 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 40px 20px;
        }

        .container {
            max-width: 800px;
            width: 100%;
            background: rgba(8, 14, 24, 0.75);
            border: 1px solid rgba(255,255,255,0.10);
            border-radius: 28px;
            padding: 40px;
            backdrop-filter: blur(18px);
            box-shadow: 0 25px 60px rgba(0,0,0,0.45);
            text-align: center;
        }

        .back {
            display: inline-block;
            margin-bottom: 25px;
            color: rgba(255,255,255,0.75);
            text-decoration: none;
            font-size: 0.95rem;
        }

        h1 {
            font-size: 2.6rem;
            margin-bottom: 20px;
        }

        .info {
            font-size: 1.2rem;
            margin: 12px 0;
            color: rgba(255,255,255,0.85);
        }

        .highlight {
            color: #4db8ff;
            font-weight: bold;
        }
    </style>
</head>
<body>
    <div class="container">
        <a href="/site" class="back">← Back to Home</a>

        <h1>Contacts</h1>

        <div class="info">
            Email: <span class="highlight">altioranexus@gmail.com</span>
        </div>

        <div class="info">
            Phone: <span class="highlight">+39 3801754783</span>
        </div>
    </div>
</body>
</html>
